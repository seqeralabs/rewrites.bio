preamble:
  - >
    Many of our most trusted tools were written years ago, when datasets were orders
    of magnitude smaller. They work correctly. They are thoroughly validated. They are
    also slow, dependency-heavy, and expensive to run at modern sequencing scale.
  - >
    The scale of the problem is real. Widely-used pipelines like nf-core/rnaseq have
    thousands of users and tens of thousands of pipeline runs. When a single tool
    wastes even a few CPU-minutes per run, the inefficiency compounds to millions of
    wasted CPU-hours across the community.
  - >
    Those wasted CPU-hours have a physical cost. At modern sequencing scale, the
    cumulative compute savings from faster tools translate directly into reduced energy
    consumption and CO2 emissions. Even conservative estimates suggest savings on the
    order of hundreds of tonnes of CO2e per year for widely-used pipelines. Efficiency
    is not just a convenience - it is an environmental responsibility.
  - >
    AI coding assistants have changed the equation. A domain expert can now rewrite
    established tools in compiled languages in days, not years. Fast code has become
    cheap. The scientific insight, careful validation, and community trust behind the
    original tools have not.

callout: |
  *A wave of AI-assisted rewrites is coming.*
  *The question is not **whether** it will happen, but whether it will happen **well**.*

preamble_closing: >
  These are the principles we follow.

sections:
  - title: Philosophy
    principles:
      - title: Credit the original authors
        description: >
          Always, everywhere. In the README, the docs, the paper, and any downstream reports.
          The scientific insight behind these tools took years to develop. A dedicated credits
          page should list every reimplemented tool with its full citation.
      - title: Emulate exactly
        description: >
          The goal is bit-identical or numerically-identical output. This inherits the
          validation history of the original tool and lets users switch with zero risk to their
          scientific conclusions. Resist the temptation to 'fix' things along the way - changing
          results voids trust.
      - title: Be transparent about AI
        description: >
          Make it clear that AI agents were used in development. This demonstrates that
          correctness was verified through output comparison, not code review alone.
          Document the development process honestly.

  - title: Planning
    principles:
      - title: Think big
        description: >
          Combine tools. Eliminate redundant I/O. Remove upstream prerequisites. Disk I/O
          is often the bottleneck - combining analyses in a single pass can deliver dramatic
          gains. A rewrite that only ports one tool to a faster language misses the real
          opportunity: rethinking how multiple tools share work.
      - title: Work small
        description: >
          Small iteration loops. One tool at a time. Step-by-step validation against the
          original output before moving on. The compound complexity of rewriting many things
          at once will bury you.
      - title: Engage upstream
        description: >
          Let original developers know about your rewrite and offer to collaborate.
          This can be difficult when combining many tools, but even a heads-up before
          public release goes a long way.

  - title: Building
    principles:
      - title: Test relentlessly with real data
        description: >
          Different data types, different sizes, different edge cases. Don't rely on artificial
          inputs - real sequencing data has quirks and format variations that synthetic data
          never captures.
      - title: Benchmark rigorously
        description: >
          Provide quantitative comparisons on realistic datasets: execution time, memory
          usage, and most importantly output equivalence. Reference inputs and expected
          outputs should be committed to the repository so anyone can reproduce the
          comparison. Include benchmarking scripts and document how to run them. Numbers
          without reproducibility are anecdotes.
      - title: Build for users
        description: >
          Clear error messages, helpful documentation, sensible defaults. Missing prerequisites
          should fail gracefully with actionable guidance. A fast tool that's frustrating to
          use won't get adopted.
      - title: Build only what you need
        description: >
          Outputs must match exactly, but you don't need to replicate every feature. Focus
          on the functionality your pipeline actually uses. A subset done well is better
          than an incomplete whole - you can always expand scope later.
      - title: Pin versions and document
        description: >
          Pin the exact version of every original tool you're emulating. Document the
          comparison methodology. Future you (and every user) needs to know exactly what
          was validated against what.

  - title: Stewardship
    principles:
      - title: Maintain and govern
        description: >
          Adopt clear contribution guidelines, a code of conduct, and a release process.
          Respond to issues. An unmaintained rewrite is worse than no rewrite because it
          sets expectations it cannot fulfill.
      - title: Preserve compatibility
        description: >
          Output formats should be identical to the originals. Downstream tools, pipeline
          integrations, and reporting frameworks should continue to work unmodified. This
          includes MultiQC modules, file naming conventions, and header formats.
          Format-identical output makes rewrites hot-swappable: users and pipeline developers
          can drop in the rewrite or revert to the original at any time with no change to
          results or downstream workflows. Adoption is risk-free because it is fully reversible.
      - title: Respect upstream licenses
        description: >
          Check the license of every tool you reimplement. Understand what it permits.
          Your rewrite's license should be at least as permissive as the most restrictive
          original.
      - title: Release as open source
        description: >
          The tools you're rewriting were built by the open-source community for the
          open-source community. Your rewrites should be too. Permissive licenses lower
          the barrier to adoption and contribution.
      - title: Contribute upstream responsibly
        description: >
          If you find genuine bugs, be sure before reporting. Really sure. AI agents can
          be very convincing that they've found a bug - only accept this after fully
          demonstrating it with real data on the unmodified upstream tool. No automated bug
          reports - they put strain on volunteer maintainers. Contribute improvements back
          to the original project where possible.
